<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Isotipo "Dos mitades" de FullPetCare (PLAN.md D20). Círculos más grandes que en
       el logo completo para que se lea a 16 px. El modo oscuro del navegador usa los
       colores claros de la paleta oscura. -->
  <style>
    .g { fill: #C25400 }
    .v { fill: #0072B2 }
    .o { fill: #0F6B66 }
    @media (prefers-color-scheme: dark) {
      .g { fill: #E8793A }
      .v { fill: #3FA0D6 }
      .o { fill: #4FD1C5 }
    }
  </style>
  <defs><clipPath id="c"><circle cx="42" cy="32" r="20"/></clipPath></defs>
  <circle class="g" cx="22" cy="32" r="20"/>
  <circle class="v" cx="42" cy="32" r="20"/>
  <circle class="o" cx="22" cy="32" r="20" clip-path="url(#c)"/>
</svg>
