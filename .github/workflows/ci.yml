# CI — se corre en cada push y en cada Pull Request.
#
# Qué es esto: un "workflow" de GitHub Actions es una receta que GitHub
# ejecuta automáticamente en una máquina virtual limpia (aquí, Ubuntu) cada
# vez que pasa algo (aquí: push o PR). No corre nada en tu Mac ni depende
# de que tu Mac esté prendida — GitHub levanta la máquina, hace el trabajo,
# y la apaga.
#
# Por qué importa que sea Linux y no Mac: ver CLAUDE.md §10 "Mac vs
# Linux" — mayúsculas en imports, `sed`, banderas de comandos. Este archivo
# es la red que atrapa esos problemas antes de que lleguen a producción.
name: CI

# Cuándo se dispara:
# - "push" solo a "main" y "develop": ese push ocurre nada más al mergear un
#   PR (ambas ramas están protegidas, nadie empuja ahí directo — tarea 1.3),
#   así que valida el estado final después de cada merge. `develop` es la
#   rama de integración (todas las ramas de feature mergean ahí); `main` es
#   producción y solo avanza por PR manual `develop` → `main` (CLAUDE.md §10).
# - "pull_request": corre en cada commit de una rama MIENTRAS tiene un PR
#   abierto. Es lo que da el check verde/rojo en la pantalla del PR, y lo
#   que la tarea 1.40 exigirá como requisito para poder mergear.
#
# Si "push" no tuviera "branches: [...]", cada commit en una rama con PR
# abierto dispararía el workflow DOS VECES para el mismo código: una por
# "push" (a la rama) y otra por "pull_request" — el doble de minutos de CI
# por nada, y el doble de probabilidad de toparse con algo como el rate
# limit de la Action del CLI de Supabase (ver el paso 6 más abajo). Con
# "branches: [main, develop]", una rama de feature solo dispara por
# "pull_request" mientras tiene PR, y "push" solo entra en juego para el
# commit de merge en "develop" o en "main".
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Un "job" es un grupo de pasos que corre junto, en una sola máquina.
  # Este proyecto tiene un solo job: si algún día el E2E de Playwright (fase
  # 6) se vuelve lento, se puede separar en su propio job que corra en
  # paralelo — por ahora, uno solo es más simple y más fácil de leer.
  test:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    steps:
      # 1) Trae el código del commit/PR a la máquina virtual. Sin este
      # paso no hay nada que probar — es literalmente un "git clone" del
      # commit exacto que disparó el workflow.
      - name: Descargar el código
        uses: actions/checkout@v4

      # 2) Instala Node. "node-version-file: .nvmrc" lee el mismo archivo
      # que usas en tu Mac con `nvm use` — así la versión de Node NUNCA se
      # escribe dos veces en el repo, se escribe una vez en .nvmrc y ambos
      # lados (tu Mac y GitHub) la leen de ahí (CLAUDE.md §10, punto 4).
      # "cache: npm" guarda node_modules entre corridas para que "npm ci"
      # no vuelva a descargar todo desde cero cada vez.
      - name: Instalar Node (misma versión que .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # 3) "npm ci" (Clean Install) es distinto de "npm install": instala
      # EXACTAMENTE las versiones que están en package-lock.json y falla si
      # el lock no coincide con package.json, en vez de "arreglarlo" solo.
      # Es lo que se usa en CI porque queremos el mismo árbol de
      # dependencias que ya se probó en local, sin sorpresas.
      - name: Instalar dependencias
        run: npm ci

      # 4) Lint: ESLint (reglas de código) + Prettier (formato), la misma
      # regla "0 warnings" que corre en tu Mac con `npm run lint`.
      - name: Lint (ESLint + Prettier)
        run: npm run lint

      # 5) Pruebas unitarias: todo lo de lib/, services/ y stores/ que NO
      # necesita una base de datos real (los mocks de session.spec.ts, los
      # tests puros de money.spec.ts). Rápidas, corren en segundos.
      - name: Pruebas unitarias
        run: npm run test:unit

      # 6) Instala el CLI de Supabase en la máquina virtual — el mismo que
      # tienes en tu Mac vía Homebrew, aquí instalado por una Action
      # oficial de Supabase en vez de brew (Linux no tiene brew instalado
      # por defecto).
      #
      # "version" va FIJA (no "latest"): con "latest", la Action tiene que
      # preguntarle a la API de GitHub cuál es el release más reciente del
      # CLI, y esa consulta comparte límite de peticiones con TODOS los
      # runners de GitHub Actions del mundo en ese momento — es fácil
      # toparse con "rate limit exceeded" (nos pasó en la primera corrida
      # de este mismo workflow). Fijar el número evita esa llamada de más
      # y es más predecible: un runner nuevo no puede sorprendernos con
      # una versión distinta a la de ayer. Se actualiza a mano cuando haga
      # falta, igual que las versiones en package.json.
      - name: Instalar el CLI de Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # 7) Levanta el mismo Supabase local que usas con `npm run db:start`:
      # Postgres + Auth + Storage en contenedores Docker. GitHub Actions
      # trae Docker preinstalado en sus runners de Ubuntu, así que no hay
      # que instalarlo aparte. Al arrancar por primera vez, el CLI aplica
      # TODAS las migraciones de supabase/migrations/ y corre seed.sql —
      # exactamente el mismo proceso que un `supabase db reset` en tu Mac.
      # Si una migración tiene un error de sintaxis, o el seed falla, este
      # paso truena aquí — antes de que ese error llegue a un PR.
      - name: Levantar Supabase local
        run: supabase start

      # 8) Pruebas de base de datos: supabase/tests/*.spec.ts, los que
      # conectan por `pg` directo a Postgres y simulan distintos roles
      # (dueño, groomer, anon...) para verificar que las políticas RLS
      # bloquean lo que deben bloquear. Este es el paso que atrapa una
      # fuga de datos entre tenants ANTES de que se mergee a main.
      - name: Pruebas de base de datos (RLS y aislamiento)
        run: npm run test:db

      # 9) Apaga los contenedores. "if: always()" significa "corre este
      # paso pase lo que pase en los pasos anteriores" — si test:db falla,
      # igual queremos apagar Docker limpiamente y liberar la máquina
      # virtual, en vez de dejarla a medias.
      - name: Apagar Supabase local
        if: always()
        run: supabase stop

  # Segundo job, SEPARADO del de arriba (tarea 6.10): el E2E de Playwright
  # (fase 6) abre un navegador real y recorre agendar → atender → cobrar de
  # punta a punta — es el más lento y el más caro de mantener de todos los
  # tests del proyecto (CLAUDE.md §9, D12). Por eso va en su propio job con
  # "needs: test": GitHub Actions no lo arranca hasta que el job "test"
  # (lint + unitarios + RLS) termine en verde. Si algo básico ya está roto,
  # no tiene caso gastar los ~30 segundos extra que tarda instalar un
  # navegador de verdad y correrlo — el E2E solo corre cuando ya vale la
  # pena confirmar que las piezas encajan juntas.
  e2e:
    name: E2E (Playwright)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node (misma versión que .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Un runner de Ubuntu nuevo no trae ni el navegador ni las librerías
      # de sistema (fuentes, `libnss3`, etc.) que un Chromium real necesita
      # para arrancar sin interfaz gráfica — a diferencia de una Mac, donde
      # ya se probó el navegador a mano antes (tareas 6.8-6.9) y esas
      # librerías ya existen. "--with-deps" instala ambas cosas de un
      # jalón; sin eso, Playwright truena aquí con un error de librería
      # faltante, no con un fallo del test en sí.
      - name: Instalar Chromium (con dependencias del sistema)
        run: npx playwright install --with-deps chromium

      - name: Instalar el CLI de Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Levantar Supabase local
        run: supabase start

      # services/supabase.ts (tarea 1.25) exige VITE_SUPABASE_URL y
      # VITE_SUPABASE_ANON_KEY para arrancar — sin un .env.local (que NUNCA
      # se sube al repo, está en .gitignore) el servidor de `npm run dev`
      # sirve la página en blanco y el test de abajo nunca encuentra el
      # formulario de login. La anon key de un Supabase LOCAL es un valor
      # FIJO y no secreto (nace del JWT_SECRET de ejemplo de
      # supabase/config.toml, el mismo en cualquier proyecto local — ver
      # README.md, "Variables de entorno") — se lee de "supabase status"
      # recién levantado, no hace falta un Secret del repo para esto.
      - name: Generar .env.local para el servidor de desarrollo
        run: |
          echo "VITE_SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d'"' -f2)" >> .env.local
          echo "VITE_SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d'"' -f2)" >> .env.local

      # playwright.config.ts levanta `npm run dev` solo (bloque
      # `webServer`) y espera a que responda antes de correr el test — no
      # hace falta un paso aparte para arrancar el servidor. La variable
      # de entorno CI (que GitHub Actions ya define sola en todo runner)
      # es la que hace que ese mismo archivo de configuración NUNCA
      # reutilice un servidor ajeno aquí, y que el reporter cambie a
      # "github" (imprime los fallos como anotaciones directo en la
      # pestaña del PR, en vez de una lista de texto plano).
      - name: Test E2E (agendar → atender → cobrar)
        run: npm run test:e2e

      # Si el test falla, el reporte HTML de Playwright (capturas de
      # pantalla y traza paso a paso del momento exacto del fallo) se sube
      # como artefacto del workflow — se descarga desde la pestaña
      # "Summary" de la corrida en GitHub, sin tener que reproducir el
      # fallo a mano para verlo.
      - name: Subir reporte de Playwright (solo si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Apagar Supabase local
        if: always()
        run: supabase stop
