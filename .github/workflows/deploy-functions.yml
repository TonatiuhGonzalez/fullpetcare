# Despliegue de Edge Functions a producción.
#
# Qué hace: cada vez que un PR se mergea a main y toca algo dentro de
# supabase/functions/, este workflow sube esa función a fullpetcare-prod
# automáticamente — mismo patrón que deploy-migrations.yml (fase 1) para
# las migraciones de la base, pero para el otro tipo de artefacto que
# vive en supabase/ y que TAMBIÉN necesita llegar a producción por su
# cuenta (una migración no se "despliega sola" junto con el código de una
# función, son dos mecanismos de Supabase completamente distintos).
#
# Por qué un workflow aparte de deploy-migrations.yml: los "paths" de
# GitHub Actions filtran por workflow completo, no por paso — si este
# fuera un paso más dentro de deploy-migrations.yml, CUALQUIER push a
# main que tocara una migración (sin tocar ninguna función) igual
# intentaría desplegar funciones sin necesidad, y viceversa. Separarlos
# significa que cada uno solo se dispara cuando de verdad hay algo suyo
# que desplegar.
name: Desplegar Edge Functions a producción

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      # Si cambia este mismo archivo (p. ej. se agrega una función nueva
      # a la lista de despliegue), también debe correr: antes un cambio
      # solo aquí no desplegaba nada.
      - '.github/workflows/deploy-functions.yml'
  # Botón "Run workflow" en GitHub Actions para desplegar a mano.
  workflow_dispatch:

jobs:
  deploy:
    name: supabase functions deploy a prod
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar el CLI de Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # A diferencia de "supabase db push" (que se conecta directo a
      # Postgres con una contraseña), desplegar una función sube su
      # código a través de la Management API de Supabase — por eso aquí
      # SOLO hace falta el access token, no SUPABASE_DB_PASSWORD.
      #
      # "--no-verify-jwt" no es necesario aquí: `verify_jwt = false` ya
      # queda declarado en supabase/config.toml (sección
      # `[functions.public-pet-view]`, tarea 7.4) y el CLI lo respeta al
      # desplegar sin que haga falta repetirlo como flag.
      - name: Desplegar public-pet-view a fullpetcare-prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy public-pet-view \
            --project-ref boajojegcmpvzjsloosk

      # invite-employee (fase 9) y platform-admin (fase 10) NO tenían paso
      # aquí: sin él, mergear a main dejaba esas funciones sin desplegar y en
      # producción las pantallas que las llaman fallaban con un 404 del
      # gateway. Mismo patrón que arriba.
      #
      # A diferencia de public-pet-view, estas dos SÍ exigen sesión: su
      # sección de supabase/config.toml deja `verify_jwt = true`, y el CLI lo
      # respeta al desplegar sin repetirlo como flag. Que quien llama sea
      # además empleado con permiso (invite-employee) o superadmin
      # (platform-admin) lo revalida cada función por dentro.
      #
      # Las variables SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY
      # que leen las funciones las inyecta la propia plataforma en la nube: no
      # hay que configurarlas ni guardarlas como secretos de GitHub.
      - name: Desplegar invite-employee a fullpetcare-prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy invite-employee \
            --project-ref boajojegcmpvzjsloosk

      - name: Desplegar platform-admin a fullpetcare-prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy platform-admin \
            --project-ref boajojegcmpvzjsloosk

      # invoicing (fase 11, facturación con el PAC) tampoco tenía paso aquí:
      # el workflow se quedó en las tres funciones de las fases 7 a 10, así que
      # Configuración > Facturación fallaba en producción con un 404 del
      # gateway aunque la migración sí estuviera aplicada. Mismo patrón.
      #
      # Exige sesión (`verify_jwt = true` en supabase/config.toml); que quien
      # llama sea el dueño de ESE negocio lo revalida la propia función.
      #
      # OJO: esta función además lee secretos propios del PAC (Facturapi) que
      # NO inyecta la plataforma. Se configuran una sola vez en el proyecto con
      # `supabase secrets set` (FACTURAPI_USER_KEY y, para timbrar de verdad,
      # FACTURAPI_MODE); este workflow solo sube el código.
      - name: Desplegar invoicing a fullpetcare-prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy invoicing \
            --project-ref boajojegcmpvzjsloosk

      # customer-account (fase 16B, cuenta del dueño de la mascota) también
      # se quedó sin paso aquí: al promover develop a main la función no se
      # subía y "Guardar en mi cuenta" fallaba con un 404 del gateway (el
      # navegador lo muestra como "no se pudo guardar", porque un 404 no
      # trae las cabeceras CORS que pide el preflight). Mismo patrón.
      #
      # A diferencia de invite-employee y platform-admin, esta función deja
      # `verify_jwt = false` en supabase/config.toml: `request_code` lo llama
      # alguien SIN sesión, y la plataforma lo rechazaría antes de ejecutar
      # nada. La función valida el JWT a mano en las acciones que lo
      # necesitan, y el CLI respeta el valor del config.toml al desplegar.
      #
      # Solo lee SUPABASE_URL y las llaves anon y service_role, que inyecta la
      # propia plataforma: no hay secretos nuevos que configurar.
      #
      # OJO: depende de la migración de customer_accounts. deploy-migrations
      # corre en el mismo push a main; si una falla, revisa que la otra haya
      # quedado aplicada.
      - name: Desplegar customer-account a fullpetcare-prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy customer-account \
            --project-ref boajojegcmpvzjsloosk
